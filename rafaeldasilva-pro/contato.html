<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato | Rafael Rodrigues da Silva</title>
</head>

<body>
  <!-- Header injected via layout.js -->

  <div id="app">
    <section class="container" style="padding: 8rem 0; text-align: center;">
      <h1 style="color: var(--color-primary); margin-bottom: 2rem;">Entre em Contato</h1>
      <p style="font-size: 1.25rem; color: var(--color-text-muted); margin-bottom: 3rem;">
        Tem interesse em palestras, consultoria ou parcerias?
      </p>
      <div style="max-width: 600px; margin: 0 auto; text-align: left;">
        <form style="display: grid; gap: 1.5rem;">
          <input type="text" placeholder="Nome"
            style="padding: 1rem; border: 1px solid var(--color-border); border-radius: 4px; width: 100%;">
          <input type="email" placeholder="Email"
            style="padding: 1rem; border: 1px solid var(--color-border); border-radius: 4px; width: 100%;">
          <textarea placeholder="Mensagem" rows="5"
            style="padding: 1rem; border: 1px solid var(--color-border); border-radius: 4px; width: 100%;"></textarea>
          <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
      </div>
    </section>
  </div>
  <script type="module" src="/main.js"></script>
</body>

</html>
